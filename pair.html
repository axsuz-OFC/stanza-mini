<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>STANZA MINI - Pairing Site</title>
    <style>
        /* Basic Reset */
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: #050505;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            position: relative;
        }

        /* 1. Background Grid (Zanta Mini Style) */
        .bg-grid {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: 
                linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
            background-size: 50px 50px;
            z-index: -3;
            transform: perspective(500px) rotateX(20deg);
            animation: gridMove 20s linear infinite;
        }

        @keyframes gridMove {
            0% { background-position: 0 0; }
            100% { background-position: 0 50px; }
        }

        /* 2. Falling Leaves Animation */
        .leaves-container {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            z-index: -1;
            perspective: 1000px;
        }

        .leaf {
            position: absolute;
            top: -50px;
            width: 40px;
            height: 40px;
            background-size: contain;
            background-repeat: no-repeat;
            /* Leaf shape using SVG with Neon Text inside */
            background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><path d="M50 0 C80 20 100 50 50 100 C0 50 20 20 50 0" fill="none" stroke="%23ff00ff" stroke-width="2"/><text x="50" y="55" font-size="20" text-anchor="middle" fill="%2300ffff" font-family="Arial" font-weight="bold">S</text></svg>');
            filter: drop-shadow(0 0 5px #ff00ff) drop-shadow(0 0 10px #00ffff);
            animation: fall linear infinite;
            opacity: 0.8;
        }

        @keyframes fall {
            0% {
                transform: translateY(-50px) rotate(0deg) translateZ(0) scale(0.5);
                opacity: 0;
            }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% {
                /* ඉස්සරහට එන එක (translateZ) සහ පාවෙන එක */
                transform: translateY(110vh) rotate(360deg) translateZ(300px) scale(1.5);
                opacity: 0;
            }
        }

        /* Randomize Leaf Positions */
        .leaf:nth-child(1) { left: 10%; animation-duration: 8s; animation-delay: 0s; }
        .leaf:nth-child(2) { left: 30%; animation-duration: 12s; animation-delay: 2s; }
        .leaf:nth-child(3) { left: 60%; animation-duration: 10s; animation-delay: 4s; }
        .leaf:nth-child(4) { left: 80%; animation-duration: 9s; animation-delay: 1s; }
        .leaf:nth-child(5) { left: 50%; animation-duration: 15s; animation-delay: 5s; }
        .leaf:nth-child(6) { left: 20%; animation-duration: 11s; animation-delay: 7s; }

        /* 3. Main Container */
        .container {
            background: rgba(15, 15, 15, 0.85);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 40px 30px;
            border-radius: 20px;
            box-shadow: 0 0 30px rgba(0, 255, 255, 0.1);
            text-align: center;
            width: 90%;
            max-width: 400px;
            z-index: 10;
            position: relative;
            transform-style: preserve-3d;
        }

        /* 4. Neon Running Text (Zanta Mini Font Style) */
        .neon-title {
            font-size: 3.5rem;
            font-weight: 900;
            font-family: 'Impact', sans-serif;
            letter-spacing: 3px;
            margin-bottom: 20px;
            text-transform: uppercase;
            
            /* Gradient for Running Color */
            background: linear-gradient(90deg, #8a2be2, #ff00ff, #00ffff, #8a2be2);
            background-size: 300% 100%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: runColors 3s linear infinite;
            
            /* Neon Glow */
            filter: drop-shadow(0 0 5px rgba(255, 0, 255, 0.5)) drop-shadow(0 0 10px rgba(0, 255, 255, 0.5));
        }

        @keyframes runColors {
            0% { background-position: 0% 50%; }
            100% { background-position: 100% 50%; }
        }

        /* Subtitle */
        .subtitle {
            color: #00ffff;
            font-size: 0.9rem;
            letter-spacing: 2px;
            margin-bottom: 30px;
            text-shadow: 0 0 5px #00ffff;
        }

        /* Input */
        input {
            width: 100%;
            padding: 15px;
            margin: 10px 0;
            border-radius: 10px;
            border: 1px solid #333;
            background: #000;
            color: #fff;
            font-size: 16px;
            outline: none;
            transition: 0.3s;
        }

        input:focus {
            border-color: #ff00ff;
            box-shadow: 0 0 10px rgba(255, 0, 255, 0.5);
        }

        /* Button */
        button {
            background: linear-gradient(90deg, #8a2be2, #ff00ff);
            color: #fff;
            padding: 15px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            cursor: pointer;
            font-weight: bold;
            width: 100%;
            margin-top: 10px;
            transition: 0.3s;
            box-shadow: 0 0 15px rgba(255, 0, 255, 0.3);
        }

        button:hover {
            box-shadow: 0 0 25px rgba(255, 0, 255, 0.7);
            transform: scale(1.02);
        }

        /* Code Box */
        #codeBox {
            display: none;
            margin-top: 20px;
            padding: 20px;
            background: #000;
            border: 2px dashed #00ffff;
            border-radius: 10px;
            font-size: 28px;
            font-weight: bold;
            color: #00ffff;
            letter-spacing: 5px;
            text-shadow: 0 0 10px #00ffff;
        }
    </style>
</head>
<body>

    <!-- 1. Background Grid -->
    <div class="bg-grid"></div>

    <!-- 2. Falling Neon Leaves -->
    <div class="leaves-container">
        <div class="leaf"></div>
        <div class="leaf"></div>
        <div class="leaf"></div>
        <div class="leaf"></div>
        <div class="leaf"></div>
        <div class="leaf"></div>
    </div>

    <!-- 3. Main Content -->
    <div class="container">
        <div class="neon-title">STANZA MINI</div>
        <div class="subtitle">- NEXT GEN SOLUTION -</div>
        
        <input type="text" id="number" placeholder="Ex: 94704536039" required>
        <button onclick="getCode()">GET PAIRING CODE</button>

        <div id="codeBox"></div>
    </div>

    <script>
        async function getCode() {
            const number = document.getElementById('number').value;
            const codeBox = document.getElementById('codeBox');
            
            if (!number) {
                alert("Please enter a valid number!");
                return;
            }

            codeBox.style.display = 'block';
            codeBox.innerText = "Loading...";
            codeBox.style.color = '#fff';
            codeBox.style.textShadow = 'none';

            try {
                const response = await fetch('/api/pair', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ number: number })
                });

                const data = await response.json();

                if (data.code) {
                    codeBox.innerText = data.code;
                    codeBox.style.color = '#00ffff';
                    codeBox.style.textShadow = '0 0 10px #00ffff';
                } else {
                    codeBox.innerText = "Error: " + (data.error || "Unknown");
                    codeBox.style.color = '#ff4444';
                    codeBox.style.textShadow = 'none';
                }
            } catch (error) {
                codeBox.innerText = "Fetch Failed!";
                codeBox.style.color = '#ff4444';
                codeBox.style.textShadow = 'none';
            }
        }
    </script>
</body>
</html>
